name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the draft release to (e.g. v0.0.0-test)"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Only alpha + rc count as prerelease for GitHub's "Latest" badge;
          # beta tags must stay non-prerelease so the updater endpoint at
          # /releases/latest/download/latest.json resolves to the newest
          # beta (GitHub refuses to mark a prerelease as Latest).
          if [[ "$TAG" =~ -(alpha|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: CI gate
    needs: prepare
    # Run the full CI (fmt / clippy / test / UI / supply-chain) on the tagged
    # ref before building, so a tag push cannot ship past a red pipeline.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.os }}
    needs: [prepare, gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu LTS: the AppImage bundles
        # everything except glibc, so the build host's glibc is the minimum the
        # AppImage runs on (24.04 would require glibc 2.39).
        os: [ubuntu-22.04, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libayatana-appindicator3-1 \
            libdbusmenu-glib4 \
            libdbusmenu-gtk3-4 \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm deps
        run: pnpm install --frozen-lockfile

      # The Tauri bundler downloads its AppRun into the tools cache with mode
      # 0770 and copies it into the AppDir as-is; linuxdeploy then renames it
      # to AppRun.wrapped. Sandboxed launchers (firejail) run the AppImage as a
      # user outside that owner/group and fail with "Permission denied".
      # Seeding the cache with a world-executable copy makes the bundler skip
      # its own download.
      - name: Seed AppImage AppRun with world-executable mode
        if: runner.os == 'Linux'
        run: |
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          curl -fsSL -o "$TOOLS/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 0755 "$TOOLS/AppRun-x86_64"

      - name: Tauri build + GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Compile Sentry in for shipped builds so the opt-in crash-reporting
          # toggle is live (it still needs the DSN env var at runtime).
          args: "--features crash-reporting"
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "everything-imu ${{ needs.prepare.outputs.tag }}"
          releaseBody: "See the auto-generated release notes below and CHANGELOG.md in the repository for the full history."
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          projectPath: apps/everything-imu-app
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          makeLatest: true

      - name: Verify AppImage permissions and glibc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage)
          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/app.AppImage"
          chmod +x "$WORK/app.AppImage"
          (cd "$WORK" && ./app.AppImage --appimage-extract >/dev/null)
          ROOT="$WORK/squashfs-root"
          # Every entrypoint must be executable by users other than the owner.
          for f in "$ROOT"/AppRun "$ROOT"/AppRun.wrapped "$ROOT"/usr/bin/*; do
            [ -e "$f" ] || continue
            mode=$(stat -c '%a' "$f")
            echo "$mode ${f#"$ROOT"/}"
            if [ $((0$mode & 01)) -eq 0 ]; then
              echo "::error::${f#"$ROOT"/} is not world-executable (mode $mode)"
              exit 1
            fi
          done
          # Report the newest glibc symbol the main binary needs.
          objdump -T "$ROOT/usr/bin/everything-imu" \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
